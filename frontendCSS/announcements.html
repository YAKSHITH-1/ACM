<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements | ACM JIT</title>
  <link rel="canonical" href="https://jyothyacm.vercel.app/announcements.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./CSS/global.css">
  <link rel="stylesheet" href="./CSS/theme.css">
  <link rel="stylesheet" href="./CSS/stars.css">
  <link rel="stylesheet" href="./CSS/typography.css">
  <link rel="stylesheet" href="./CSS/announcements.css">
  <link rel="icon" href="acm-favicon.svg" type="image/svg+xml">
</head>

<body>
  <div class="bg-overlay"></div>
  <div id="global-navbar"></div>

  <main class="main-content">
    <header class="page-header ann-page-header">
      <p class="label">Bulletin</p>
      <h1 class="page-title">Announcements</h1>
      <p class="page-subtitle">Stay updated with the latest news, sprints, and core updates from our ACM chapter.</p>
    </header>

    <div class="events-grid">
      <div>
        <div class="section-head" style="margin-bottom: 1.5rem;">
          <h2 class="section-title">Live Feed</h2>
          <span class="badge-live">Updating</span>
        </div>
        <div class="announcements-grid reveal" id="announcements-list">
          <!-- Announcements will be injected here by JS -->
        </div>
      </div>

      <aside class="ann-side">
        <h2 class="section-title ann-side-title">Categories</h2>
        <div class="ann-side-card ann-categories">
          <div class="ann-legend-item">
            <span class="ann-legend-dot dot-cyan"></span>
            <span class="ann-legend-label">Hackathons &amp; Sprints</span>
          </div>
          <div class="ann-legend-item">
            <span class="ann-legend-dot dot-violet"></span>
            <span class="ann-legend-label">Core Updates</span>
          </div>
          <div class="ann-legend-item">
            <span class="ann-legend-dot dot-emerald"></span>
            <span class="ann-legend-label">Workshops &amp; Labs</span>
          </div>
          <div class="ann-legend-item">
            <span class="ann-legend-dot dot-rose"></span>
            <span class="ann-legend-label">Urgent Alerts</span>
          </div>
        </div>

        <h2 class="section-title ann-side-title ann-side-title--spaced">Activity Stats</h2>
        <div class="ann-side-card ann-stats">
          <div class="ann-stat-tile num-cyan">
            <span class="ann-stat-number">24</span>
            <span class="ann-stat-label">This Month</span>
          </div>
          <div class="ann-stat-tile num-violet">
            <span class="ann-stat-number">156</span>
            <span class="ann-stat-label">Total Posts</span>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="JS/voronoi-bg.js"></script>
  <script src="main.js"></script>
</body>

</html>
