<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements | ACM JIT</title>
  <link rel="canonical" href="https://jyothyacm.vercel.app/announcements.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./CSS/global.css">
  <link rel="stylesheet" href="./CSS/theme.css">
  <link rel="stylesheet" href="./CSS/stars.css">
  <link rel="stylesheet" href="./CSS/typography.css">
  <link rel="stylesheet" href="./CSS/announcements.css">
  <link rel="icon" href="assets/Logo.png" type="image/png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body>
  <div class="bg-overlay"></div>
  <div id="global-navbar"></div>

  <main class="main-content">
    <div class="announcements-wrapper">
      <header class="page-header ann-page-header">
        <p class="label">Chapter Bulletin</p>
        <h1 class="page-title">Announcements</h1>
      </header>

      <!-- Filter Tabs -->
      <div class="ann-filter-tabs" id="ann-filter-tabs">
        <button class="ann-tab-btn is-active" data-cat="all">All Dispatches</button>
        <button class="ann-tab-btn" data-cat="cyan">Hackathons</button>
        <button class="ann-tab-btn" data-cat="violet">Core Updates</button>
        <button class="ann-tab-btn" data-cat="emerald">Workshops</button>
        <button class="ann-tab-btn" data-cat="rose">Urgent Alerts</button>
      </div>

      <div class="announcements-grid reveal" id="announcements-list">
        <!-- Announcements will be injected here by JS -->
      </div>
    </div>
  </main>

  <script src="JS/animated-dots-bg.js"></script>
  <script src="main.js?v=2.0.2"></script>
</body>

</html>
