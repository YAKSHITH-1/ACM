        linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 8.75H3.75V20h3.19V8.75ZM5.35 3.33a1.85 1.85 0 1 0 0 3.7 1.85 1.85 0 0 0 0-3.7ZM20.25 13.8c0-3.02-1.61-4.43-3.76-4.43a3.25 3.25 0 0 0-2.94 1.62h-.04V8.75h-3.06V20h3.19v-5.57c0-1.47.28-2.89 2.1-2.89 1.79 0 1.81 1.68 1.81 2.98V20h3.19v-6.2h-.49Z"/></svg>',
        portfolio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>'
      };

      // ── DOM References ──
      const facultyRow = document.getElementById('ts-faculty-row');
      const cardsRow = document.getElementById('ts-cards-row');
      const spotlightWrap = document.getElementById('ts-spotlight-wrap');
      const spotlightCardSlot = document.getElementById('ts-spotlight-card-slot');
      const spotlightDossier = document.getElementById('ts-spotlight-dossier');
      const stageHeader = document.getElementById('ts-stage-header');
      const backBtn = document.getElementById('ts-back-btn');
      const bottomSwitcher = document.getElementById('ts-bottom-switcher');

      let currentMemberId = null;

      // ── Helper: Render Avatar Image or Vector SVG Fallback ──
      function renderAvatarHtml(member) {
        const svgContent = member.avatarSvg ? member.avatarSvg.replace('<svg ', '<svg class="ts-avatar-svg" ') : '';
        if (member.image) {
          return `
            <img src="${member.image}" alt="${member.name}" class="ts-avatar-img" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='block';" />
            <div class="ts-avatar-fallback" style="display:none;">${svgContent}</div>
          `;
        }
        return svgContent;
      }

      // ── Helper: Build Individual Card Element ──
      function buildCard(m, isFaculty = false) {
        const card = document.createElement('div');
        card.className = `ts-card ${m.themeClass} ${isFaculty ? 'ts-card-faculty' : ''}`;
        card.dataset.id = m.id;

        // Faculty Badge Pill Tag
        if (isFaculty && m.tag) {
          const facultyTag = document.createElement('div');
          facultyTag.className = 'ts-faculty-tag';
          facultyTag.textContent = m.tag;
          card.appendChild(facultyTag);
        }

        // Floating Role Sticker Badge
        const stickerBadge = document.createElement('div');
        stickerBadge.className = 'ts-sticker ts-stk-tr';
        stickerBadge.setAttribute('title', `${m.role} Sticker`);
        stickerBadge.innerHTML = `<img src="${m.sticker}" alt="${m.role} Sticker" class="ts-sticker-img" />`;

        // Avatar / Photo Wrap
        const avatarWrap = document.createElement('div');
        avatarWrap.className = 'ts-avatar-wrap';
        avatarWrap.innerHTML = renderAvatarHtml(m);

        // Info (Signature name + Role)
        const info = document.createElement('div');
        info.className = 'ts-info';
        info.innerHTML = `
          <div class="ts-name">${m.displayName}</div>
          <div class="ts-location">${m.role}</div>
        `;

        card.appendChild(stickerBadge);
        card.appendChild(avatarWrap);
        card.appendChild(info);

        // Click to expand
        card.addEventListener('click', () => openSpotlight(m.id));

        return card;
      }

      // ── Render Both Faculty Row and Student Officers Deck ──
      function renderDeck() {
        // 1. Render Faculty Mentors
        if (facultyRow) {
          facultyRow.innerHTML = '';
          FACULTY_MEMBERS.forEach(m => {
            facultyRow.appendChild(buildCard(m, true));
          });
        }

        // 2. Render Student Chapter Officers
        if (cardsRow) {
          cardsRow.innerHTML = '';
          OFFICER_MEMBERS.forEach(m => {
            cardsRow.appendChild(buildCard(m, false));
          });
        }
      }

      // ── Render Bottom Switcher Chips ──
      function renderBottomSwitcher() {
        bottomSwitcher.innerHTML = '';
        ALL_MEMBERS.forEach((m) => {
          const isFaculty = FACULTY_MEMBERS.some(f => f.id === m.id);
          const chip = document.createElement('button');
          chip.className = `ts-switcher-chip ${m.id === currentMemberId ? 'is-active' : ''}`;
          chip.innerHTML = `
            <span class="ts-switcher-dot" style="background: ${m.dotColor}"></span>
            <span>${isFaculty ? '★ ' : ''}${m.displayName}</span>
          `;
          chip.addEventListener('click', () => openSpotlight(m.id));
          bottomSwitcher.appendChild(chip);
        });
      }

      // ── Open Spotlight View ──
      function openSpotlight(id) {
        const member = ALL_MEMBERS.find(m => m.id === id);
        if (!member) return;

        currentMemberId = id;
        const isFaculty = FACULTY_MEMBERS.some(f => f.id === id);

        // Hide deck & stage headers, show back button & spotlight
        cardsRow.classList.add('is-hidden');
        stageHeader.classList.add('is-hidden');
        backBtn.classList.add('is-visible');
        spotlightWrap.classList.remove('is-hidden');

        // Render Left Spotlight Card with Role Sticker Badge
        spotlightCardSlot.innerHTML = `
          <div class="ts-spotlight-card ${member.themeClass}">
            ${isFaculty && member.tag ? `<div class="ts-faculty-tag" style="top: -12px; font-size: 0.7rem; padding: 3px 12px;">${member.tag}</div>` : ''}
            <div class="ts-sticker ts-stk-tr" title="${member.role} Sticker">
              <img src="${member.sticker}" alt="${member.role} Sticker" class="ts-sticker-img" />
            </div>
            <div class="ts-avatar-wrap">
              ${renderAvatarHtml(member)}
            </div>
            <div class="ts-info">
              <div class="ts-name">${member.name}</div>
              <div class="ts-location">${member.role} · ${member.location}</div>
            </div>
          </div>
        `;

        // Render Right Detail Dossier
        const skillsHtml = member.skills.map(s => `<span class="ts-skill-pill">${s}</span>`).join('');

        let socialsHtml = '';
        if (member.socials.github) {
          socialsHtml += `<a href="${member.socials.github}" target="_blank" rel="noopener noreferrer" class="ts-action-btn">${ICONS.github} GitHub</a>`;
        }
        if (member.socials.linkedin) {
          socialsHtml += `<a href="${member.socials.linkedin}" target="_blank" rel="noopener noreferrer" class="ts-action-btn">${ICONS.linkedin} LinkedIn</a>`;
        }
        if (member.socials.portfolio) {
          socialsHtml += `<a href="${member.socials.portfolio}" target="_blank" rel="noopener noreferrer" class="ts-action-btn">${ICONS.portfolio} Portfolio</a>`;
        }

        spotlightDossier.className = `ts-spotlight-dossier ${member.dossierClass}`;
        spotlightDossier.innerHTML = `
          <div class="ts-dossier-role">
            <span class="ts-dossier-role-sticker"><img src="${member.sticker}" alt="${member.role}"></span>
            <span>●</span> ${member.role} · ACM JIT
          </div>
          <h3 class="ts-dossier-quote">${member.quote}</h3>
          <p class="ts-dossier-bio">${member.bio}</p>
          <div class="ts-dossier-skills">${skillsHtml}</div>
          <div class="ts-dossier-actions">${socialsHtml}</div>
        `;

        // Update bottom switcher chips
        renderBottomSwitcher();
      }

      // ── Close Spotlight (Back to Deck) ──
      function closeSpotlight() {
        currentMemberId = null;
        spotlightWrap.classList.add('is-hidden');
        backBtn.classList.remove('is-visible');
        stageHeader.classList.remove('is-hidden');
        cardsRow.classList.remove('is-hidden');
      }

      backBtn.addEventListener('click', closeSpotlight);

      // Keyboard Esc to exit spotlight
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !spotlightWrap.classList.contains('is-hidden')) {
          closeSpotlight();
        }
      });

      // ── Init ──
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderDeck);
      } else {
        renderDeck();
      }
    })();
  </script>
</body>

</html>
