<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | ACM JIT</title>
  <link rel="canonical" href="https://jyothyacm.vercel.app/forgot-password.html" />
  <meta name="description"
    content="Recover your ACM JIT portal account — request a secure reset token and set a new password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./CSS/global.css">
  <link rel="stylesheet" href="./CSS/theme.css">
  <link rel="stylesheet" href="./CSS/stars.css">
  <link rel="stylesheet" href="./CSS/typography.css">
  <link rel="icon" href="assets/Logo.png" type="image/png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    body {
      background: #111A16;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      min-height: 100vh;
    }

    body.light-theme {
      background: #f4f4f5;
    }

    .auth-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 7rem 1.25rem 4rem;
      user-select: none;
    }

    /* ── Neo-Brutalist Stage Card (Know Us Style) ── */
    .nb-card {
      width: 100%;
      max-width: 34rem;
      background-color: #FCFCFD;
      border: 3px solid #0B0F0D;
      border-radius: 24px;
      box-shadow: 8px 8px 0px #0B0F0D;
      padding: 2.25rem;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    body.dark-theme .nb-card,
    body:not(.light-theme) .nb-card {
      background-color: #16221c;
      border-color: #D1FAE5;
      box-shadow: 8px 8px 0px #064E3B;
    }

    /* Playful Corner Doodles */
    .nb-sparkle-left {
      position: absolute;
      top: -14px;
      left: 18px;
      font-size: 1.5rem;
      color: #FACC15;
      text-shadow: 2px 2px 0px #0B0F0D;
      pointer-events: none;
      animation: nbFloat 3.5s ease-in-out infinite alternate;
    }

    .nb-sparkle-right {
      position: absolute;
      top: -14px;
      right: 18px;
      font-size: 1.5rem;
      color: #38BDF8;
      text-shadow: 2px 2px 0px #0B0F0D;
      pointer-events: none;
      animation: nbFloat 4s ease-in-out infinite alternate-reverse;
    }

    @keyframes nbFloat {
      0% { transform: translateY(0) rotate(0deg) scale(0.95); }
      100% { transform: translateY(-6px) rotate(14deg) scale(1.15); }
    }

    /* ── Header Badge Pill ── */
    .nb-badge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 0.85rem;
    }

    .nb-pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FECDD3;
      color: #0B0F0D;
      border: 2px solid #0B0F0D;
      box-shadow: 2.5px 2.5px 0px #0B0F0D;
      border-radius: 999px;
      padding: 4px 16px;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ── Typography ── */
    .nb-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.6rem, 3.2vw, 2.15rem);
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: #0B0F0D;
      margin: 0 0 0.5rem;
    }

    body.dark-theme .nb-title,
    body:not(.light-theme) .nb-title {
      color: #D1FAE5;
    }

    .nb-desc {
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.55;
      text-align: center;
      color: #475569;
      margin: 0 0 1.75rem;
    }

    body.dark-theme .nb-desc,
    body:not(.light-theme) .nb-desc {
      color: #94A3B8;
    }

    /* ── Form Controls ── */
    .nb-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .nb-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #0B0F0D;
      margin-bottom: 0.35rem;
    }

    body.dark-theme .nb-label,
    body:not(.light-theme) .nb-label {
      color: #D1FAE5;
    }

    .nb-input {
      width: 100%;
      background: #FFFFFF;
      border: 2.5px solid #0B0F0D;
      border-radius: 12px;
      box-shadow: 3px 3px 0px #0B0F0D;
      color: #0B0F0D;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    body.dark-theme .nb-input,
    body:not(.light-theme) .nb-input {
      background: #0d1512;
      border-color: #D1FAE5;
      box-shadow: 3px 3px 0px #064E3B;
      color: #D1FAE5;
    }

    .nb-input:focus {
      outline: none;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px #0B0F0D;
    }

    body.dark-theme .nb-input:focus,
    body:not(.light-theme) .nb-input:focus {
      box-shadow: 5px 5px 0px #D1FAE5;
    }

    .nb-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #F1F5F9;
    }

    body.dark-theme .nb-input:disabled,
    body:not(.light-theme) .nb-input:disabled {
      background: #09100d;
    }

    /* Password Input Group */
    .nb-input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .nb-toggle-pwd {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #64748B;
      cursor: pointer;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .nb-toggle-pwd:hover {
      color: #0B0F0D;
      background: rgba(0, 0, 0, 0.06);
    }

    /* ── Neo-Brutalist Action Button ── */
    .nb-btn-submit {
      width: 100%;
      border-radius: 14px;
      background: #FDE047;
      color: #0B0F0D;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.95rem 1.5rem;
      border: 2.5px solid #0B0F0D;
      box-shadow: 4px 4px 0px #0B0F0D;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .nb-btn-submit:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #0B0F0D;
      background: #FEF08A;
    }

    .nb-btn-submit:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #0B0F0D;
    }

    /* ── Footer Links ── */
    .nb-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748B;
    }

    .nb-links a {
      color: #0B0F0D;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    body.dark-theme .nb-links a,
    body:not(.light-theme) .nb-links a {
      color: #34D399;
    }

    .nb-links a:hover {
      color: #10B981;
    }

    @media (max-width: 440px) {
      .nb-card { padding: 1.5rem 1.25rem; }
    }
  </style>
  <script>
    if (localStorage.getItem("theme") === "light" || !localStorage.getItem("theme")) {
      document.documentElement.classList.add("light-theme");
    }
  </script>
</head>

<body>
  <script>
    if (localStorage.getItem("theme") === "light") {
      document.body.classList.add("light-theme");
    }
  </script>
  <div class="bg-overlay"></div>
  <div id="global-navbar"></div>

  <main class="auth-page">
    <section class="nb-card" aria-labelledby="forgot-title">
      <!-- Playful Corner Stickers -->
      <span class="nb-sparkle-left">✦</span>
      <span class="nb-sparkle-right">★</span>

      <!-- Badge Pill -->
      <div class="nb-badge-wrap">
        <span class="nb-pill-badge">🔑 PASSWORD RECOVERY</span>
      </div>

      <h1 id="forgot-title" class="nb-title">Reset Your Password</h1>
      <p class="nb-desc">Enter your registered email address to receive a secure token, then set a new password.</p>

      <form id="forgot-password-form" class="nb-form" autocomplete="on">
        <div data-reset-request-field>
          <label class="nb-label">Registered Email</label>
          <input name="identifier" type="email" placeholder="name@jyothyit.ac.in" class="nb-input" autocomplete="email" required>
        </div>

        <div data-reset-token-note
          style="display:none;font-size:0.875rem;font-weight:700;padding:0.85rem 1rem;background:#FEF3C7;border:2px solid #0B0F0D;box-shadow:2.5px 2.5px 0px #0B0F0D;border-radius:12px;color:#78350F;line-height:1.5;text-align:center;"></div>

        <div>
          <label class="nb-label">Reset Token</label>
          <input name="resetToken" type="text" placeholder="Enter reset token" class="nb-input" style="background:#BAE6FD;font-family:monospace;font-weight:800;" autocomplete="one-time-code" disabled required>
        </div>

        <div data-password-field style="display:none;">
          <label class="nb-label">New Password</label>
          <div class="nb-input-group">
            <input id="forgot-password" name="newPassword" type="password" placeholder="Enter new password (min. 8 characters)"
              class="nb-input" style="padding-right:3rem;" autocomplete="new-password" disabled required>
            <button type="button" class="nb-toggle-pwd auth-toggle-password" aria-label="Show password" data-target="forgot-password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.15rem;height:1.15rem;">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" style="display:none;width:1.15rem;height:1.15rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div data-password-field style="display:none;">
          <label class="nb-label">Confirm Password</label>
          <div class="nb-input-group">
            <input id="confirm-forgot-password" name="confirmPassword" type="password" placeholder="Confirm new password"
              class="nb-input" style="padding-right:3rem;" autocomplete="new-password" disabled required>
            <button type="button" class="nb-toggle-pwd auth-toggle-password" aria-label="Show password" data-target="confirm-forgot-password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.15rem;height:1.15rem;">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" style="display:none;width:1.15rem;height:1.15rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="nb-btn-submit">Send Reset Token</button>
      </form>

      <div class="nb-links">
        <div><a href="join-us.html">Back to Sign In</a></div>
      </div>
    </section>
  </main>

  <!-- Popup Modal (Neo-Brutalist) -->
  <div id="popup"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:1000;padding:1rem;"
    onkeydown="if(event.key==='Escape')document.getElementById('popup-btn').click()">
    <div id="popup-content"
      style="background:#FCFCFD;border:3px solid #0B0F0D;border-radius:20px;box-shadow:8px 8px 0px #0B0F0D;padding:2rem;max-width:440px;width:100%;text-align:center;">
      <h2 id="popup-title" style="font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:900;color:#0B0F0D;margin:0 0 0.75rem;text-transform:uppercase;"></h2>
      <p id="popup-message" style="font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:500;color:#334155;line-height:1.6;margin:0 0 1.5rem;"></p>
      <button id="popup-btn" type="button"
        style="width:100%;border:2.5px solid #0B0F0D;box-shadow:3px 3px 0px #0B0F0D;background:#FDE047;color:#0B0F0D;padding:0.75rem 1.5rem;border-radius:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:1rem;text-transform:uppercase;transition:all 0.15s ease;">Dismiss</button>
    </div>
  </div>

  <script src="JS/animated-dots-bg.js"></script>
  <script src="main.js?v=2.0.1"></script>
  <script>
    // Password toggle interaction
    document.querySelectorAll(".auth-toggle-password").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");
        const input = document.getElementById(targetId);
        if (!input) return;
        const iconEye = btn.querySelector(".icon-eye");
        const iconEyeOff = btn.querySelector(".icon-eye-off");
        if (input.type === "password") {
          input.type = "text";
          if (iconEye) iconEye.style.display = "none";
          if (iconEyeOff) iconEyeOff.style.display = "block";
          btn.setAttribute("aria-label", "Hide password");
        } else {
          input.type = "password";
          if (iconEye) iconEye.style.display = "block";
          if (iconEyeOff) iconEyeOff.style.display = "none";
          btn.setAttribute("aria-label", "Show password");
        }
      });
    });
  </script>
</body>

</html>
